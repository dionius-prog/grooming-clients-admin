<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Груминг — клиенты</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Клиенты">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<script>
  (function(){
    try {
      var t = localStorage.getItem('grooming_theme_v1');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch(e){}
  })();
</script>

<style>
  :root{
    --bg:#0d1016; --bg-radial-1:#1d2634; --bg-radial-2:#0d1016;
    --panel:#1b2029; --panel2:#232a35; --line:#2a3341; --text:#e8edf5;
    --muted:#8b97a8; --accent:#4c8dff; --accent-soft:#243046; --accent-text:#9dc0ff;
    --accent-shadow:rgba(76,141,255,.45); --input-bg:#12161e; --dd-menu-bg:#1e242e;
    --dd-hover-bg:#2a3341; --panel3:#1f2531;
    --ok:#2fbf71; --bad:#e5484d; --money:#ffd166; --purple:#a78bfa; --teal:#7ee0e6; --orange:#ffa58c;
    --soft-blue:rgba(76,141,255,.15); --soft-blue-text:#9dc0ff;
    --soft-purple:rgba(167,139,250,.15); --soft-purple-text:#c4b5fd;
    --soft-pink:rgba(255,158,203,.15); --soft-pink-text:#ff9ecb;
    --soft-teal:rgba(126,224,230,.15); --soft-teal-text:#b8f0f4;
    --soft-yellow:rgba(255,209,102,.15); --soft-yellow-text:#ffe4a3;
    --soft-green:rgba(47,191,113,.12); --soft-green-text:#b8ffd0;
    --soft-red:rgba(229,72,77,.12); --soft-red-text:#ffc2c4;
    --back-border:#37414f;
  }

  html[data-theme="light"]{
    --bg:#f4f6fa; --bg-radial-1:#e6ecf5; --bg-radial-2:#f6f8fc;
    --panel:#ffffff; --panel2:#eef1f6; --line:#dde3ed; --text:#16202e;
    --muted:#69768a; --accent:#3b7ce6; --accent-soft:#e4edff; --accent-text:#2a5db8;
    --accent-shadow:rgba(59,124,230,.35); --input-bg:#f4f6fa; --dd-menu-bg:#ffffff;
    --dd-hover-bg:#eef1f6; --panel3:#f0f3f8;
    --ok:#1a9d5a; --bad:#d63a3f; --money:#b8860b; --purple:#7c5dd6; --teal:#2a9bab; --orange:#d96b4a;
    --soft-blue:rgba(59,124,230,.12); --soft-blue-text:#2a5db8;
    --soft-purple:rgba(124,93,214,.12); --soft-purple-text:#5b3fb5;
    --soft-pink:rgba(219,39,119,.12); --soft-pink-text:#be185d;
    --soft-teal:rgba(42,155,171,.12); --soft-teal-text:#1a7080;
    --soft-yellow:rgba(201,147,26,.15); --soft-yellow-text:#8a6400;
    --soft-green:rgba(26,157,90,.12); --soft-green-text:#146c3e;
    --soft-red:rgba(214,58,63,.12); --soft-red-text:#a02830;
    --back-border:#cfd6e0;
  }

  *{box-sizing:border-box}
  body{margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%, var(--bg-radial-1), var(--bg-radial-2) 60%);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
  .app{max-width:820px;margin:0 auto;padding:0 16px 100px;padding-top:env(safe-area-inset-top);padding-bottom:calc(100px + env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;gap:12px;padding:20px 0 16px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
  header h1{font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back{background:var(--panel2);border:1px solid var(--back-border);color:var(--text);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer;font-size:18px;line-height:1;flex-shrink:0}
  .back:active{transform:scale(.95)}
  .theme-btn{background:transparent;border:1px solid var(--back-border);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:17px;line-height:1;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;transition:.15s}

  .screen{display:none;flex-direction:column;gap:14px}
  .screen.active{display:flex}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 10px;font-weight:600}

  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:var(--panel2);color:var(--text);transition:.15s}
  button:hover{filter:brightness(1.18)}
  button:active{transform:scale(.98)}
  .primary{background:var(--accent);color:#fff}
  .danger{background:var(--soft-red);color:var(--soft-red-text)}
  .ghost{background:transparent;border:1px solid var(--back-border);color:var(--muted)}
  .full{width:100%;padding:14px;font-weight:600}
  .hint{color:var(--muted);font-size:14px;margin:8px 0 0;text-align:center}

  input[type=text],input[type=tel],input[type=date],textarea{font:inherit;background:var(--input-bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 13px;outline:none;width:100%}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:70px;font-family:inherit}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  label:first-child{margin-top:0}
  .form-actions{display:flex;gap:10px;margin-top:16px}
  .form-actions button{flex:1}

  .tools-row{display:flex;gap:8px;margin-bottom:6px;position:relative;z-index:15}
  .dropdown-wrap{flex:1;position:relative;min-width:0}
  .tool-btn{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:11px 12px;border-radius:12px;font-size:13px;font-weight:600;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .dropdown-wrap.open .tool-btn{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
  .tool-btn .arrow{font-size:9px;opacity:.7;transition:transform .2s}
  .dropdown-wrap.open .tool-btn .arrow{transform:rotate(180deg)}

  .dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--dd-menu-bg);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:60;box-shadow:0 16px 40px rgba(0,0,0,.35);max-height:340px;overflow-y:auto;display:none}
  .dropdown-wrap.open .dd-menu{display:block}
  .dd-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.1s}
  .dd-item:hover{background:var(--dd-hover-bg)}
  .dd-item.active{background:var(--accent-soft)}
  .dd-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
  .dd-blk{flex:1;min-width:0}
  .dd-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-hint{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-item.active .dd-name{color:var(--accent-text)}
  .dd-check{color:var(--accent);font-size:16px;font-weight:700;opacity:0;flex-shrink:0}
  .dd-item.active .dd-check{opacity:1}

  .dd-backdrop{position:fixed;inset:0;z-index:5;display:none;background:transparent}
  .dd-backdrop.open{display:block}

  .mm-wrap{position:relative}
  .mm-wrap input{padding-right:44px}
  .mm-wrap .mm-suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;font-weight:600;pointer-events:none}
  .mm-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mm-pair label{margin-top:0}
  .mm-pair .pp-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:left;margin-bottom:6px;font-weight:600}

  .search-wrap{margin-bottom:4px}
  #searchInput{width:100%;padding:12px 14px;font:inherit;background:var(--input-bg);border:1px solid var(--line);color:var(--text);border-radius:12px;outline:none}
  #searchInput:focus{border-color:var(--accent)}

  .avatar{background:linear-gradient(135deg,#4c8dff,#2fbf71);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;color:#fff;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .d-ago.fresh{color:var(--soft-green-text)}
  .d-ago.mid{color:var(--soft-yellow-text)}
  .d-ago.old{color:var(--soft-red-text)}
  .d-ago{font-size:11px}

  .dog-list{display:flex;flex-direction:column;gap:8px}
  .dog-list.v1 .dog-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}
  .dog-list.v1 .avatar{width:44px;height:44px;border-radius:50%;font-size:20px}
  .dog-list.v1 .dog-info{flex:1;min-width:0}
  .dog-list.v1 .dog-name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v1 .dog-meta{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v1 .dog-right{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap;line-height:1.35}
  .dog-list.v1 .d-cnt{font-weight:600;color:var(--accent-text);display:block;font-size:14px}
  .dog-list.v1 .d-ago{display:block;margin-top:8px}

  .dog-list.v2 .dog-card{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;padding:16px 16px 16px 14px;cursor:pointer;transition:.15s;border-left:5px solid #4a5568}
  .dog-list.v2 .avatar{width:52px;height:52px;border-radius:50%;font-size:22px}
  .dog-list.v2 .dog-info{flex:1;min-width:0}
  .dog-list.v2 .dog-name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v2 .dog-meta{color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v2 .dog-right{text-align:right;line-height:1.4;flex-shrink:0}
  .dog-list.v2 .d-cnt{font-weight:700;color:var(--accent-text);font-size:13px;background:var(--soft-blue);padding:3px 10px;border-radius:99px;display:inline-block;white-space:nowrap}
  .dog-list.v2 .d-date{color:var(--muted);font-size:12px;display:block;margin-top:6px}

  .dog-list.v3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dog-list.v3 .dog-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
  .dog-list.v3 .tile-head{display:flex;align-items:center;gap:10px}
  .dog-list.v3 .avatar{width:40px;height:40px;border-radius:50%;font-size:18px}
  .dog-list.v3 .tile-name-blk{flex:1;min-width:0}
  .dog-list.v3 .dog-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
  .dog-list.v3 .dog-meta{color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v3 .tile-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .dog-list.v3 .d-date{font-variant-numeric:tabular-nums}
  .dog-list.v3 .d-cnt{background:var(--soft-blue);color:var(--accent-text);padding:2px 7px;border-radius:99px;font-weight:700;font-size:11px}
  .dog-list.v3 .tile-rows{display:flex;flex-direction:column;gap:5px}
  .dog-list.v3 .t-row{display:flex;align-items:flex-start;gap:5px;font-size:11px;line-height:1.3}
  .dog-list.v3 .t-icon{flex-shrink:0;font-size:11px;width:14px;text-align:center;padding-top:1px}
  .dog-list.v3 .t-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .dog-list.v3 .t-row.mm-body .t-text{color:var(--soft-blue-text)}
  .dog-list.v3 .t-row.mm-paws .t-text{color:var(--soft-purple-text)}
  .dog-list.v3 .t-row.services .t-text{color:var(--soft-teal-text)}
  .dog-list.v3 .t-row.notes .t-text{color:var(--soft-yellow-text);font-style:italic}

  .dog-list.v4 .dog-card{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:.18s}
  .dog-list.v4 .avatar{width:64px;height:64px;border-radius:18px;font-size:26px;box-shadow:0 8px 20px var(--accent-shadow)}
  .dog-list.v4 .dog-info{flex:1;min-width:0}
  .dog-list.v4 .dog-name{font-weight:700;font-size:18px;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v4 .dog-meta{color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v4 .d-last{display:flex;align-items:center;gap:6px;color:var(--accent-text);font-size:12px;margin-top:8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v4 .d-last::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .dog-list.v4 .dog-right{text-align:right;flex-shrink:0}
  .dog-list.v4 .d-cnt{font-size:22px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
  .dog-list.v4 .d-cnt-lbl{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
  .dog-list.v4 .d-date{color:var(--muted);font-size:11px;margin-top:8px;font-variant-numeric:tabular-nums}

  .dog-list.v5 .dog-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.15s}
  .dog-list.v5 .d-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .dog-list.v5 .avatar{width:44px;height:44px;border-radius:12px;font-size:20px}
  .dog-list.v5 .dog-name-blk{flex:1;min-width:0}
  .dog-list.v5 .dog-name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v5 .dog-meta{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v5 .d-visits{background:var(--soft-blue);color:var(--accent-text);font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;flex-shrink:0}
  .dog-list.v5 .d-badges{display:flex;flex-direction:column;gap:6px}
  .dog-list.v5 .d-badges-top{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
  .dog-list.v5 .d-badge{font-size:11px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--panel2);color:var(--muted);display:inline-flex;align-items:flex-start;gap:5px;max-width:100%;line-height:1.35;align-self:flex-start;flex:0 0 auto}
  .dog-list.v5 .d-badge .bi{flex-shrink:0}
  .dog-list.v5 .d-badge .bt{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
  .dog-list.v5 .d-badge.mm-body{background:var(--soft-blue);color:var(--soft-blue-text)}
  .dog-list.v5 .d-badge.mm-paws{background:var(--soft-purple);color:var(--soft-purple-text)}
  .dog-list.v5 .d-badge.services{background:var(--soft-teal);color:var(--soft-teal-text)}
  .dog-list.v5 .d-badge.notes{background:var(--soft-yellow);color:var(--soft-yellow-text)}
  .dog-list.v5 .d-badge.shampoo{background:var(--soft-pink);color:var(--soft-pink-text)}
  .dog-list.v5 .d-badge.date{background:var(--panel2);color:var(--muted);margin-left:auto}

  .dog-list.v6{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dog-list.v6 .dog-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
  .dog-list.v6 .d-img{height:90px;background:linear-gradient(135deg,#4c8dff,#2fbf71);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:rgba(255,255,255,.92);position:relative}
  .dog-list.v6 .d-img img{width:100%;height:100%;object-fit:cover}
  .dog-list.v6 .d-img.shpits{background:linear-gradient(135deg,#4c8dff,#6b9eff)}
  .dog-list.v6 .d-img.york{background:linear-gradient(135deg,#2fbf71,#4dd990)}
  .dog-list.v6 .d-img.poodle{background:linear-gradient(135deg,#a78bfa,#c4b5fd)}
  .dog-list.v6 .d-img.norwich{background:linear-gradient(135deg,#ffd166,#ffb84d)}
  .dog-list.v6 .d-status{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;letter-spacing:.5px;text-transform:uppercase}
  .dog-list.v6 .d-body{padding:12px 14px}
  .dog-list.v6 .dog-name{font-weight:700;font-size:15px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v6 .dog-meta{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dog-list.v6 .dog-right{display:flex;justify-content:space-between;align-items:center;font-size:11px}
  .dog-list.v6 .d-date{color:var(--muted);font-variant-numeric:tabular-nums}
  .dog-list.v6 .d-cnt{background:var(--soft-blue);color:var(--accent-text);padding:2px 8px;border-radius:99px;font-weight:700}

  .dog-header{display:flex;gap:14px;align-items:flex-start}
  .dog-header .avatar{width:64px;height:64px;border-radius:50%;font-size:28px}
  .dog-header-info{flex:1;min-width:0}
  .dog-header-info .dog-name{font-size:22px;font-weight:700}
  .dog-header-info .dog-sub{color:var(--muted);font-size:13px;margin-top:4px}
  .info-row{display:flex;gap:8px;margin-top:10px;font-size:14px}
  .info-row .lbl{color:var(--muted);min-width:70px}
  .dog-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .dog-actions button{flex:1;min-width:80px}

  .visit-list{display:flex;flex-direction:column;gap:10px}
  .visit-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
  .visit-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .visit-date{font-weight:600;font-size:15px}
  .visit-date .vd-ago{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
  .visit-mm-row{display:flex;gap:6px;flex-wrap:wrap}
  .visit-mm{font-size:12px;font-weight:700;background:var(--soft-blue);color:var(--accent-text);padding:3px 10px;border-radius:99px;white-space:nowrap}
  .visit-services{color:var(--muted);font-size:13px;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .visit-photos{display:flex;gap:8px}
  .visit-photos .vp{flex:1;position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--input-bg);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;border:1px dashed var(--back-border)}
  .visit-photos .vp.has{border-style:solid;border-color:transparent}
  .visit-photos .vp img{width:100%;height:100%;object-fit:cover;display:block}
  .visit-photos .vp .vp-lbl{position:absolute;bottom:4px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;letter-spacing:.5px}

  .view-photos{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .view-photo{background:var(--input-bg);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .view-photo .vp-lbl{padding:8px 12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .view-photo img{width:100%;display:block;cursor:pointer}
  .view-photo .no-photo{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
  .view-block{margin-top:14px}
  .view-block .vb-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px}
  .view-block .vb-text{background:var(--panel2);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .view-mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .view-mm-cell{background:var(--panel2);border-radius:10px;padding:14px 12px;text-align:center}
  .view-mm-cell .vmc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .view-mm-cell .vmc-val{font-size:22px;font-weight:700;color:var(--accent-text);font-variant-numeric:tabular-nums}

  .photo-upload{position:relative;border-radius:12px;overflow:hidden;background:var(--input-bg);border:2px dashed var(--back-border);aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s}
  .photo-upload input[type=file]{display:none}
  .pu-buttons{display:flex;flex-direction:column;gap:8px;padding:12px;width:100%}
  .pu-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);color:var(--text);border:1px solid var(--back-border);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;transition:.15s;cursor:pointer}
  .photo-upload img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-upload .pu-remove{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;z-index:2}
  .photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .photo-pair .pp-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:6px;font-weight:600}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain}
  .lightbox .close-x{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  #installBtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;padding:13px 24px;border-radius:99px;border:none;background:var(--accent);color:#fff;font:600 15px system-ui,sans-serif;box-shadow:0 10px 28px var(--accent-shadow);cursor:pointer;z-index:99}

  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
  .empty-state .es-icon{font-size:48px;margin-bottom:12px;opacity:.5}

  .field-error{color:var(--bad);font-size:12px;margin-top:4px;display:none}
  .field-error.show{display:block}

  .prefill-hint{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
</style>
</head>
<body>

<div class="app">

    <header>
    <button id="backBtn" class="back" hidden>←</button>
    <h1 id="screenTitle">✂️ Клиенты</h1>
    <button id="themeBtn" class="theme-btn" title="Сменить тему">🌙</button>
    
    <!-- НОВАЯ КНОПКА НАСТРОЕК -->
    <div class="dropdown-wrap" id="settingsWrap" style="flex: 0 0 auto;">
      <button class="theme-btn" id="settingsBtn" title="Настройки" style="font-size: 19px;">⚙️</button>
      <div class="dd-menu" id="settingsMenu" style="width: 150px; left: auto; right: 0;">
        <div class="dd-item" id="exportBtn">
          <div class="dd-icon">📤</div>
          <div class="dd-blk"><div class="dd-name">Экспорт</div></div>
        </div>
        <div class="dd-item" id="importBtn">
          <div class="dd-icon">📥</div>
          <div class="dd-blk"><div class="dd-name">Импорт</div></div>
        </div>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json" style="display: none;">
    <!-- КОНЕЦ НОВОЙ КНОПКИ -->
  </header>

  <section id="screenList" class="screen active">
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="🔍 Кличка, порода, хозяин, дата, мм…" autocomplete="off">
    </div>
    <div class="tools-row">
      <div class="dropdown-wrap" id="sortWrap">
        <button class="tool-btn" id="sortBtn">
          <span id="sortBtnLabel">🔤 Алфавит</span>
          <span class="arrow">▼</span>
        </button>
        <div class="dd-menu" id="sortMenu"></div>
      </div>
      <div class="dropdown-wrap" id="viewWrap">
        <button class="tool-btn" id="viewBtn">
          <span id="viewBtnLabel">👁 Полоска</span>
          <span class="arrow">▼</span>
        </button>
        <div class="dd-menu" id="viewMenu"></div>
      </div>
    </div>
    <button id="addDogBtn" class="primary full">+ Добавить собаку</button>
    
    <!-- НОВЫЕ КНОПКИ БЭКАПА -->
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button id="exportBtn" class="ghost" style="flex: 1; padding: 10px;">📤 Экспорт</button>
      <button id="importBtn" class="ghost" style="flex: 1; padding: 10px;">📥 Импорт</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display: none;">
    <!-- КОНЕЦ НОВЫХ КНОПОК -->
    
    <div id="dogList" class="dog-list v2"></div>
  </section>

  <section id="screenDog" class="screen">
    <div class="panel">
      <div class="dog-header">
        <div class="avatar" id="dogAvatar">🐕</div>
        <div class="dog-header-info">
          <div class="dog-name" id="dogNameView">—</div>
          <div class="dog-sub" id="dogBreedView">—</div>
        </div>
      </div>
      <div id="dogInfoView"></div>
      <div class="dog-actions">
        <button id="editDogBtn" class="ghost">✎ Изменить</button>
        <button id="deleteDogBtn" class="danger">✕ Удалить</button>
      </div>
    </div>
    <button id="addVisitBtn" class="primary full">+ Добавить визит</button>
    <div>
      <h2>История визитов</h2>
      <div id="visitList" class="visit-list"></div>
      <p id="visitEmpty" class="hint" hidden>Пока нет визитов. Нажмите «Добавить визит».</p>
    </div>
  </section>

  <section id="screenDogForm" class="screen">
    <div class="panel">
      <h2 id="dogFormTitle">Новая собака</h2>
      <label for="fDogName">Кличка *</label>
      <input id="fDogName" type="text" placeholder="Например, Бублик">
      <div class="field-error" id="errDogName">Укажите кличку</div>

      <label for="fDogBreed">Порода</label>
      <input id="fDogBreed" type="text" placeholder="Шпиц, Йорк, Пудель…" list="breedSuggestions">
      <datalist id="breedSuggestions">
        <option value="Шпиц"></option>
        <option value="Йорк"></option>
        <option value="Пудель"></option>
        <option value="Норвич-терьер"></option>
        <option value="Мальтезе"></option>
        <option value="Чихуахуа"></option>
        <option value="Мопс"></option>
        <option value="Такса"></option>
        <option value="Другая"></option>
      </datalist>

      <label for="fDogOwner">Хозяин</label>
      <input id="fDogOwner" type="text" placeholder="Имя владельца">

      <label for="fDogPhone">Телефон</label>
      <input id="fDogPhone" type="tel" placeholder="+7 …">

      <label for="fDogNotes">Описание</label>
      <textarea id="fDogNotes" placeholder="Особенности характера, аллергии, любит/не любит…"></textarea>

      <div class="form-actions">
        <button id="cancelDogForm" class="ghost">Отмена</button>
        <button id="saveDogForm" class="primary">Сохранить</button>
      </div>
    </div>
  </section>

  <section id="screenVisitForm" class="screen">
    <div class="panel">
      <h2 id="visitFormTitle">Новый визит</h2>

      <label for="fVisitDate">Дата визита *</label>
      <input id="fVisitDate" type="date">

      <label>Стрижка под машинку</label>
      <div class="mm-pair">
        <div>
          <div class="pp-lbl">Корпус</div>
          <div class="mm-wrap">
            <input id="fVisitBody" type="text" inputmode="numeric" placeholder="6" autocomplete="off">
            <span class="mm-suffix">мм</span>
          </div>
        </div>
        <div>
          <div class="pp-lbl">Лапы</div>
          <div class="mm-wrap">
            <input id="fVisitPaws" type="text" inputmode="numeric" placeholder="9" autocomplete="off">
            <span class="mm-suffix">мм</span>
          </div>
        </div>
      </div>
      <div class="prefill-hint" id="prefillHint" hidden></div>

      <label for="fVisitServices">Услуги</label>
      <textarea id="fVisitServices" placeholder="Стрижка корпуса, купание, когти…"></textarea>
      <label for="fVisitShampoo">Шампунь</label>
      <input id="fVisitShampoo" type="text" placeholder="Например, ISB Hemp">

      <label>Фото до и после</label>
      <div class="photo-pair">
        <div>
          <div class="pp-lbl">До</div>
          <div class="photo-upload" id="uploadBefore"></div>
        </div>
        <div>
          <div class="pp-lbl">После</div>
          <div class="photo-upload" id="uploadAfter"></div>
        </div>
      </div>

      <label for="fVisitNotes">Заметки к визиту</label>
      <textarea id="fVisitNotes" placeholder="Что понравилось, что учесть в следующий раз…"></textarea>

      <div class="form-actions">
        <button id="cancelVisitForm" class="ghost">Отмена</button>
        <button id="saveVisitForm" class="primary">Сохранить</button>
      </div>
    </div>
  </section>

  <section id="screenVisitView" class="screen">
    <div class="panel">
      <h2 id="visitViewTitle">Визит</h2>
      <div id="visitViewBody"></div>
    </div>
    <div class="dog-actions">
      <button id="editVisitBtn" class="ghost">✎ Изменить визит</button>
      <button id="deleteVisitBtn" class="danger">✕ Удалить</button>
    </div>
  </section>

</div>

<button id="installBtn">⬇ Установить на телефон</button>

<div class="dd-backdrop" id="ddBackdrop"></div>

<div class="lightbox" id="lightbox">
  <button class="close-x" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
(function(){
  "use strict";

  const LS_KEY      = 'grooming_clients_v1';
  const LS_SORT_KEY = 'grooming_clients_sort_v1';
  const LS_VIEW_KEY = 'grooming_clients_view_v1';
  const LS_THEME_KEY= 'grooming_theme_v1';

  const VIEWS = [
    { id: 'v1', name: 'Сейчас',        icon: '📋', hint: 'Классические карточки' },
    { id: 'v2', name: 'Полоска',       icon: '🎨', hint: 'Цвет породы слева' },
    { id: 'v3', name: 'Плитки',        icon: '🔲', hint: 'Сетка с деталями' },
    { id: 'v4', name: 'Крупное фото',  icon: '🖼', hint: 'Большой аватар' },
    { id: 'v5', name: 'Бейджи',        icon: '🏷', hint: 'Всё плашками' },
    { id: 'v6', name: 'Фото сверху',   icon: '📸', hint: 'Баннер-плитки' }
  ];

  const SORTS = [
    { id: 'name', name: 'По алфавиту',    icon: '🔤', hint: 'Бублик, Жуля, Пёсель…' },
    { id: 'date', name: 'По дате визита', icon: '📅', hint: 'Свежие визиты сверху' }
  ];

  const $ = id => document.getElementById(id);
  const screenTitle = $('screenTitle');
  const backBtn     = $('backBtn');
  const themeBtn    = $('themeBtn');
  const settingsWrap = $('settingsWrap');
  const settingsBtn  = $('settingsBtn');
  const exportBtn    = $('exportBtn');
  const importBtn    = $('importBtn');
  const importFile   = $('importFile');
  const screens     = {
    list:       $('screenList'),
    dog:        $('screenDog'),
    dogForm:    $('screenDogForm'),
    visitForm:  $('screenVisitForm'),
    visitView:  $('screenVisitView')
  };

  const dogList     = $('dogList');
  const searchInput = $('searchInput');
  const addDogBtn   = $('addDogBtn');
  const exportBtn   = $('exportBtn');
  const importBtn   = $('importBtn');
  const importFile  = $('importFile');

  const sortWrap     = $('sortWrap');
  const sortBtn      = $('sortBtn');
  const sortBtnLabel = $('sortBtnLabel');
  const sortMenu     = $('sortMenu');

  const viewWrap     = $('viewWrap');
  const viewBtn      = $('viewBtn');
  const viewBtnLabel = $('viewBtnLabel');
  const viewMenu     = $('viewMenu');

  const ddBackdrop   = $('ddBackdrop');

  const dogAvatar   = $('dogAvatar');
  const dogNameView = $('dogNameView');
  const dogBreedView= $('dogBreedView');
  const dogInfoView = $('dogInfoView');
  const editDogBtn  = $('editDogBtn');
  const deleteDogBtn= $('deleteDogBtn');
  const addVisitBtn = $('addVisitBtn');
  const visitList   = $('visitList');
  const visitEmpty  = $('visitEmpty');

  const dogFormTitle = $('dogFormTitle');
  const fDogName    = $('fDogName');
  const fDogBreed   = $('fDogBreed');
  const fDogOwner   = $('fDogOwner');
  const fDogPhone   = $('fDogPhone');
  const fDogNotes   = $('fDogNotes');
  const errDogName  = $('errDogName');

  const visitFormTitle = $('visitFormTitle');
  const fVisitDate     = $('fVisitDate');
  const fVisitBody     = $('fVisitBody');
  const fVisitPaws     = $('fVisitPaws');
  const fVisitServices = $('fVisitServices');
  const fVisitShampoo  = $('fVisitShampoo');
  const fVisitNotes    = $('fVisitNotes');
  const prefillHint    = $('prefillHint');
  const uploadBefore   = $('uploadBefore');
  const uploadAfter    = $('uploadAfter');

  const visitViewTitle = $('visitViewTitle');
  const visitViewBody  = $('visitViewBody');

  const lightbox      = $('lightbox');
  const lightboxImg   = $('lightboxImg');
  const lightboxClose = $('lightboxClose');

  let state = { dogs: [] };
  let sortMode = 'name';
  let viewMode = 'v2';
  let currentDogId  = null;
  let currentVisitId= null;
  let editingDogId  = null;
  let editingVisitId= null;

  let tempPhotoBefore = null;
  let tempPhotoAfter  = null;

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }

  /* ===== ТЕМА ===== */
  function getSavedTheme(){
    try {
      const t = localStorage.getItem(LS_THEME_KEY);
      if (t === 'light' || t === 'dark') return t;
    } catch(e){}
    return 'dark';
  }
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'light' ? '☀️' : '🌙';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f6fa' : '#0d1016');
  }
  function toggleTheme(){
    const cur = getSavedTheme();
    const next = cur === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(LS_THEME_KEY, next); } catch(e){}
    applyTheme(next);
  }
  themeBtn.addEventListener('click', toggleTheme);
    settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (settingsWrap.classList.contains('open')) {
      closeAllDropdowns();
    } else {
      closeAllDropdowns();
      settingsWrap.classList.add('open');
      ddBackdrop.classList.add('open');
    }
  });

  /* ===== базовые функции ===== */
  function todayISO(){
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }
  function fmtDate(iso){
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
  }
  function fmtDateShort(iso){
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getDate())}.${p(d.getMonth()+1)}.${String(d.getFullYear()).slice(-2)}`;
  }
  function daysAgo(iso){
    if (!iso) return null;
    const then = new Date(iso + 'T00:00:00');
    if (isNaN(then)) return null;
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.floor((now - then) / 86400000);
  }
  function daysAgoText(iso){
    const d = daysAgo(iso);
    if (d === null) return '';
    if (d === 0) return 'сегодня';
    if (d === 1) return 'вчера';
    if (d >= 2 && d <= 4) return `${d} дня назад`;
    if (d >= 5 && d <= 20) return `${d} дней назад`;
    const m10 = d % 10, m100 = d % 100;
    if (m10 === 1 && m100 !== 11) return `${d} день назад`;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return `${d} дня назад`;
    return `${d} дней назад`;
  }
  function daysAgoTextShort(iso){
    const d = daysAgo(iso);
    if (d === null) return '';
    if (d === 0) return 'сегодня';
    if (d === 1) return '1 дн.';
    return `${d} дн.`;
  }
  function daysAgoClass(iso){
    const d = daysAgo(iso);
    if (d === null) return '';
    if (d <= 30) return 'fresh';
    if (d >= 90) return 'old';
    return 'mid';
  }
  function initials(name){
    const s = String(name || '').trim();
    if (!s) return '🐕';
    return s.slice(0, 1).toUpperCase();
  }
  function dogAvatarUrl(d){
    const visits = (d.visits || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    for (const v of visits){
      if (v.photoAfter)  return v.photoAfter;
      if (v.photoBefore) return v.photoBefore;
    }
    return null;
  }
  function avatarHtml(d){
    const url = dogAvatarUrl(d);
    if (url) return `<div class="avatar"><img src="${url}" alt="${esc(d.name)}"></div>`;
    return `<div class="avatar">${esc(initials(d.name))}</div>`;
  }
   function breedColor(d){
    const b = (d.breed || '').toLowerCase().trim();
    if (!b) return '#4a5568'; // Серый, если порода вообще не указана

    // Цвета для популярных пород (чтобы было красиво)
    if (b.includes('шпиц'))   return '#4c8dff';
    if (b.includes('йорк'))   return '#2fbf71';
    if (b.includes('пудел'))  return '#a78bfa';
    if (b.includes('норвич')) return '#ffd166';
    if (b.includes('чихуа'))  return '#7ee0e6';
    if (b.includes('мопс'))   return '#ffa58c';
    if (b.includes('мальтезе'))return '#ff9ecb';

    // А для ВСЕХ ОСТАЛЬНЫХ (введенных вручную) генерируем уникальный цвет
    let hash = 0;
    for (let i = 0; i < b.length; i++) {
      hash = b.charCodeAt(i) + ((hash << 5) - hash);
    }
    const hue = Math.abs(hash) % 360; // Вычисляем оттенок от 0 до 360
    return `hsl(${hue}, 70%, 60%)`; // Выдаем насыщенный цвет
  }
  function breedClass(d){
    const b = (d.breed || '').toLowerCase();
    if (b.includes('шпиц'))   return 'shpits';
    if (b.includes('йорк'))   return 'york';
    if (b.includes('пудел'))  return 'poodle';
    if (b.includes('норвич')) return 'norwich';
    return '';
  }
  function pluralVisits(n){
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'визит';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'визита';
    return 'визитов';
  }
  function cleanMm(s){
    return String(s || '').trim().replace(/[^\d.,\s]/g, '');
  }
  function save(){
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch(e){
      alert('Не удалось сохранить. Возможно, закончилось место в памяти браузера.\n\nПопробуйте удалить старые визиты с фото.');
    }
  }
  function load(){
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw){
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.dogs)){
          state = parsed;
          state.dogs.forEach(d => {
            (d.visits || []).forEach(v => {
              if (v.clipperMm && !v.clipperBody){
                v.clipperBody = v.clipperMm;
                delete v.clipperMm;
              }
            });
          });
          return;
        }
      }
    } catch(e){}
    state = { dogs: [] };
  }
  function loadSort(){
    try {
      const s = localStorage.getItem(LS_SORT_KEY);
      if (s === 'name' || s === 'date') sortMode = s;
    } catch(e){}
  }
  function saveSort(){ try { localStorage.setItem(LS_SORT_KEY, sortMode); } catch(e){} }
  function loadView(){
    try {
      const v = localStorage.getItem(LS_VIEW_KEY);
      if (v && VIEWS.find(x => x.id === v)) viewMode = v;
    } catch(e){}
  }
  function saveView(){ try { localStorage.setItem(LS_VIEW_KEY, viewMode); } catch(e){} }

    else if (active === 'visitForm' || active === 'visitView') showDog(currentDogId);

  function dogMatchesQuery(d, q){
    if (!q) return true;
    if ((d.name  || '').toLowerCase().includes(q)) return true;
    if ((d.breed || '').toLowerCase().includes(q)) return true;
    if ((d.owner || '').toLowerCase().includes(q)) return true;
    if ((d.phone || '').toLowerCase().includes(q)) return true;

    for (const v of (d.visits || [])){
      const iso = v.date || '';
      const ru = fmtDate(iso);
      const ruShort = ru.slice(0, 5);
      const year = ru.slice(6);
      if (iso.includes(q)) return true;
      if (ru.includes(q)) return true;
      if (ruShort.includes(q)) return true;
      if (year.includes(q)) return true;
      if ((v.clipperBody || '').toLowerCase().includes(q)) return true;
      if ((v.clipperPaws || '').toLowerCase().includes(q)) return true;
      if ((v.services || '').toLowerCase().includes(q)) return true;
      if ((v.shampoo || '').toLowerCase().includes(q)) return true;
      if ((v.notes || '').toLowerCase().includes(q)) return true;
    }
    return false;
  }

  function getLastVisitDate(d){
    const visits = (d.visits || []);
    if (!visits.length) return '';
    return visits.reduce((max, v) => (v.date || '') > max ? (v.date || '') : max, '');
  }
  function getLastVisit(d){
    const visits = (d.visits || []);
    if (!visits.length) return null;
    return visits.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  }

  function applySort(arr){
    if (sortMode === 'date'){
      arr.sort((a, b) => {
        const da = getLastVisitDate(a);
        const db = getLastVisitDate(b);
        if (!da && !db) return (a.name || '').localeCompare(b.name || '', 'ru');
        if (!da) return 1;
        if (!db) return -1;
        return db.localeCompare(da);
      });
    } else {
      arr.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
    }
    return arr;
  }

  function openFilePicker(which, source){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    if (source === 'camera') input.setAttribute('capture', 'environment');
    input.style.display = 'none';

    input.addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0];
      document.body.removeChild(input);
      if (!f) return;
      try {
        const data = await compressImage(f, 800, 0.72);
        if (which === 'before'){
          tempPhotoBefore = data;
          renderPhotoSlot(uploadBefore, data, 'before');
        } else {
          tempPhotoAfter = data;
          renderPhotoSlot(uploadAfter, data, 'after');
        }
      } catch(err){
        alert('Не удалось обработать фото.');
      }
    });

    document.body.appendChild(input);
    input.click();
  }

  function compressImage(file, maxSide, quality){
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')){ reject(new Error('not image')); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > h && w > maxSide){ h = Math.round(h * maxSide / w); w = maxSide; }
          else if (h > maxSide){ w = Math.round(w * maxSide / h); h = maxSide; }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(c.toDataURL('image/jpeg', quality)); }
          catch(err){ reject(err); }
        };
        img.onerror = () => reject(new Error('load'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('read'));
      reader.readAsDataURL(file);
    });
  }

      fVisitBody.value = visit.clipperBody || '';

        lastWithMm = sorted.find(v => v.clipperBody || v.clipperPaws);

        fVisitPaws.value = lastWithMm.clipperPaws || '';

        fVisitBody.value = '';
        fVisitPaws.value = '';

    showScreen('visitForm', visit ? 'Изменить визит' : 'Новый визит');

    const clipperPaws = cleanMm(fVisitPaws.value);

    if (editingVisitId){
      const v = d.visits.find(x => x.id === editingVisitId);
      if (v){
        v.date        = date;
        v.clipperBody = clipperBody;
        v.clipperPaws = clipperPaws;
        v.services    = fVisitServices.value.trim();
        v.shampoo     = fVisitShampoo.value.trim();
        v.notes       = fVisitNotes.value.trim();
        v.photoBefore = tempPhotoBefore;
        v.photoAfter  = tempPhotoAfter;
      }
      save();
      showVisit(editingVisitId);
    } else {
      const v = {
        id: uid(),
        date,
        clipperBody,
        clipperPaws,
        services: fVisitServices.value.trim(),
        shampoo: fVisitShampoo.value.trim(),
        notes: fVisitNotes.value.trim(),
        photoBefore: tempPhotoBefore,
        photoAfter: tempPhotoAfter,
        createdAt: Date.now()
      };
      d.visits.push(v);
      save();
      showDog(d.id);
    }
  });

  function showVisit(visitId){
    const d = findDog(currentDogId);
    if (!d) return;
    const v = d.visits.find(x => x.id === visitId);
    if (!v){ showDog(currentDogId); return; }
    currentVisitId = v.id;

    visitViewTitle.textContent = `${fmtDate(v.date)} · ${daysAgoText(v.date)}`;
    screenTitle.textContent = `${d.name} · ${fmtDate(v.date)}`;

    let html = '';
    if (v.clipperBody || v.clipperPaws){
      html += `<div class="view-block">
                 <div class="vb-lbl">Стрижка под машинку</div>
                 <div class="view-mm-grid">
                   <div class="view-mm-cell">
                     <div class="vmc-lbl">Корпус</div>
                     <div class="vmc-val">${v.clipperBody ? esc(v.clipperBody) + ' мм' : '—'}</div>
                   </div>
                   <div class="view-mm-cell">
                     <div class="vmc-lbl">Лапы</div>
                     <div class="vmc-val">${v.clipperPaws ? esc(v.clipperPaws) + ' мм' : '—'}</div>
                   </div>
                 </div>
               </div>`;
    }
    html += `<div class="view-block">
               <div class="vb-lbl">Услуги</div>
               <div class="vb-text">${esc(v.services || '—')}</div>
             </div>`;
                if (v.shampoo){
      html += `<div class="view-block">
                 <div class="vb-lbl">Шампунь</div>
                 <div class="vb-text">${esc(v.shampoo)}</div>
               </div>`;
    }
    html += `<div class="view-photos">
               <div class="view-photo">
                 <div class="vp-lbl">До</div>
                 ${v.photoBefore ? `<img src="${v.photoBefore}" data-src="${v.photoBefore}" alt="До">`
                                : `<div class="no-photo">Фото не добавлено</div>`}
               </div>
               <div class="view-photo">
                 <div class="vp-lbl">После</div>
                 ${v.photoAfter ? `<img src="${v.photoAfter}" data-src="${v.photoAfter}" alt="После">`
                               : `<div class="no-photo">Фото не добавлено</div>`}
               </div>
             </div>`;
    if (v.notes){
      html += `<div class="view-block">
                 <div class="vb-lbl">Заметки</div>
                 <div class="vb-text">${esc(v.notes)}</div>
               </div>`;
    }
    visitViewBody.innerHTML = html;
    showScreen('visitView', `${d.name} · ${fmtDate(v.date)}`);
  }

  visitViewBody.addEventListener('click', e => {
    const img = e.target.closest('img');
    if (!img) return;
    lightboxImg.src = img.dataset.src || img.src;
    lightbox.classList.add('open');
  });

  lightboxClose.addEventListener('click', () => {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  });
  lightbox.addEventListener('click', e => {
    if (e.target === lightbox){
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }
  });

  editVisitBtn.addEventListener('click', () => {
    const d = findDog(currentDogId);
    if (!d) return;
    const v = d.visits.find(x => x.id === currentVisitId);
    if (v) openVisitForm(v);
  });

  deleteVisitBtn.addEventListener('click', () => {
    const d = findDog(currentDogId);
    if (!d) return;
    if (!confirm('Удалить этот визит?')) return;
    d.visits = d.visits.filter(x => x.id !== currentVisitId);
    save();
    showDog(d.id);
  });

    /* ===== ЭКСПОРТ И ИМПОРТ БАЗЫ ===== */
  
  exportBtn.addEventListener('click', () => {
    if (!state.dogs || state.dogs.length === 0) {
      alert('Нет данных для сохранения.');
      return;
    }
    const dataStr = JSON.stringify(state, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    
    const date = new Date().toISOString().slice(0,10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grooming_backup_${date}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => {
    importFile.click();
  });

  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (!confirm('Внимание! Загрузка файла заменит ВСЕ текущие данные. Продолжить?')) {
      importFile.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (parsed && Array.isArray(parsed.dogs)) {
          state = parsed;
          save();
          renderList();
          alert('База успешно загружена! Собак в базе: ' + state.dogs.length);
        } else {
          alert('Ошибка: неверный формат файла.');
        }
      } catch (err) {
        alert('Ошибка при чтении файла.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });
  
    /* ===== ЭКСПОРТ И ИМПОРТ БАЗЫ ===== */
  
  exportBtn.addEventListener('click', () => {
    closeAllDropdowns();
    if (!state.dogs || state.dogs.length === 0) {
      alert('Нет данных для сохранения.');
      return;
    }
    const dataStr = JSON.stringify(state, null, 2);
    const blob = new Blob([dataStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    
    const date = new Date().toISOString().slice(0,10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `grooming_backup_${date}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  importBtn.addEventListener('click', () => {
    closeAllDropdowns();
    importFile.click();
  });

  importFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (!confirm('Внимание! Загрузка файла заменит ВСЕ текущие данные. Продолжить?')) {
      importFile.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (parsed && Array.isArray(parsed.dogs)) {
          state = parsed;
          save();
          renderList();
          alert('База успешно загружена! Собак в базе: ' + state.dogs.length);
        } else {
          alert('Ошибка: неверный формат файла.');
        }
      } catch (err) {
        alert('Ошибка при чтении файла.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });
  applyTheme(getSavedTheme());
  load();
  loadSort();
  loadView();
  updateToolBtns();
  renderList();
  showScreen('list', '✂️ Клиенты');

})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('SW не зарегистрирован:', err);
      });
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('Установка:', outcome);
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });
</script>

</body>
</html>
